name: MotoTrack APK

on:
  workflow_dispatch:
  push:
    branches: [mototrack-apk]
  pull_request:
    paths:
      - 'mototrack/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mototrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build installable debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoTrack-APK
          path: mototrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MotoTrack-test-reports
          path: mototrack/app/build/reports/tests/
          if-no-files-found: ignore
